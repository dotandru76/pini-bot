<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דפוס בית יצחק - הצ'אט של פיני</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --user-msg-bg: #dbeafe;
            --bot-msg-bg: #f3f4f6;
            --text-color: #1f2937;
            --accent-color: #10b981; /* Green for success/money */
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            color: var(--text-color);
        }

        /* --- Layout --- */
        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* --- Sidebar (Dashboard) --- */
        .sidebar {
            width: 300px;
            background: #1e293b;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #334155;
        }

        .sidebar-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
        }

        .stat-label { font-size: 0.8rem; color: #94a3b8; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: var(--accent-color); }

        .cart-section {
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            background: #334155;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            border-right: 3px solid var(--primary-color);
        }

        .cart-total {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #334155;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        .pdf-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .pdf-btn:hover { background: var(--secondary-color); }

        /* --- Chat Area --- */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            z-index: 10;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
            white-space: pre-wrap; /* שומר על ירידת שורה */
        }

        .message.bot {
            background: var(--bot-msg-bg);
            align-self: flex-start;
            border-top-right-radius: 2px;
        }

        .message.user {
            background: var(--user-msg-bg);
            align-self: flex-end;
            border-top-left-radius: 2px;
        }

        /* --- Quick Replies --- */
        .quick-replies {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .chip {
            background: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background: var(--primary-color);
            color: white;
        }

        /* --- Typing Indicator --- */
        .typing {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 10px;
            align-self: flex-start;
            display: none; /* Hidden by default */
            font-style: italic;
        }

        /* --- Input Area --- */
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus { outline: 2px solid var(--primary-color); border-color: transparent; }

        button.send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.send-btn:hover { background: var(--secondary-color); }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            .sidebar { display: none; } /* במובייל נסתיר את הדשבורד כרגע */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📊 דשבורד ניהול</span>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">הכנסה יומית</div>
                    <div class="stat-value" id="stat-revenue">₪0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">הזמנות סגורות</div>
                    <div class="stat-value" id="stat-orders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">יחס המרה</div>
                    <div class="stat-value" id="stat-conversion">0%</div>
                </div>
            </div>

            <div class="sidebar-header" style="margin-top: 20px;">
                <span>🛒 עגלה פעילה</span>
            </div>

            <div class="cart-section" id="cart-items">
                <div style="text-align: center; color: #94a3b8; margin-top: 20px;">העגלה ריקה</div>
            </div>

            <div class="cart-total" id="cart-total-display">
                סה"כ: ₪0
            </div>
            <button class="pdf-btn" onclick="downloadPDF()">📄 הורד הצעת מחיר (PDF)</button>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="avatar">פ</div>
                <div>
                    <div style="font-weight: bold;">פיני - דפוס בית יצחק</div>
                    <div style="font-size: 0.8rem; color: #10b981;">
                        <span class="status-dot"></span> מחובר (Agentic Mode)
                    </div>
                </div>
            </div>

            <div class="messages" id="messages-container">
                <div class="message bot">
                    אהלן! אני פיני. 👋<br>
                    אני כאן כדי לתת הצעות מחיר, לבדוק זמינות ולסגור הזמנות.<br>
                    נסה אותי: "צריך 1000 כרטיסי ביקור למחר"
                </div>
                
                <div class="quick-replies" id="initial-replies">
                    <div class="chip" onclick="sendMessage('כמה עולים 1000 כרטיסי ביקור?')">כמה עולה כרטיס ביקור?</div>
                    <div class="chip" onclick="sendMessage('צריך דחוף רולאפ להיום')">דחוף להיום!</div>
                </div>
            </div>

            <div class="typing" id="typing-indicator" style="margin-right: 20px;">
                פיני מקליד...
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="כתוב הודעה..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">שלח</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const userId = 'user_' + Math.random().toString(36).substr(2, 9);
        let currentCart = [];
        let isProcessing = false;

        // --- Core Logic ---

        async function sendMessage(text = null) {
            if (isProcessing) return;

            const inputField = document.getElementById('user-input');
            const message = text || inputField.value.trim();
            
            if (!message) return;

            // 1. UI Update (User Message)
            appendMessage(message, 'user');
            inputField.value = '';
            removeQuickReplies(); // נקה כפתורים ישנים
            
            isProcessing = true;
            showTyping(true);

            try {
                // 2. Server Call
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        message: message
                    })
                });

                const data = await response.json();

                // 3. UI Update (Bot Response)
                showTyping(false);
                appendMessage(data.content, 'bot');
                
                // 4. Render Quick Replies
                if (data.quickReplies && data.quickReplies.length > 0) {
                    appendQuickReplies(data.quickReplies);
                }

                // 5. Update State (Cart & Dashboard)
                updateDashboard(data.dashboard);
                updateCart(data.cart);
                currentCart = data.cart; // שמור לשימוש מקומי

            } catch (error) {
                console.error('Error:', error);
                showTyping(false);
                appendMessage('אופס, הייתה תקלה בתקשורת. נסה שוב.', 'bot');
            } finally {
                isProcessing = false;
                scrollToBottom();
                inputField.focus();
            }
        }

        // --- UI Helper Functions ---

        function appendMessage(text, sender) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            // המרת לינקים אם יש (למשל PDF)
            div.innerHTML = text.replace(/\n/g, '<br>'); 
            container.appendChild(div);
            scrollToBottom();
        }

        function appendQuickReplies(replies) {
            const container = document.getElementById('messages-container');
            const qrDiv = document.createElement('div');
            qrDiv.className = 'quick-replies';
            
            replies.forEach(reply => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = reply.text;
                // בלחיצה, שלח את ה-Value לשרת
                chip.onclick = () => sendMessage(reply.value);
                qrDiv.appendChild(chip);
            });

            container.appendChild(qrDiv);
            scrollToBottom();
        }

        function removeQuickReplies() {
            // מסיר כפתורים ישנים כדי לא לבלבל
            const oldQRs = document.querySelectorAll('.quick-replies');
            oldQRs.forEach(el => el.remove());
        }

        function showTyping(show) {
            const indicator = document.getElementById('typing-indicator');
            indicator.style.display = show ? 'block' : 'none';
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }

        // --- Dashboard & Cart Functions ---

        function updateDashboard(dashboard) {
            if (!dashboard) return;
            // הנחה: הדשבורד מחזיר מספרים מעוצבים או גולמיים
            // המרת מספרים לפורמט מטבע אם צריך
            document.getElementById('stat-revenue').innerText = '₪' + (dashboard.dailyRevenue || 0).toLocaleString();
            document.getElementById('stat-orders').innerText = dashboard.dailyOrders || 0;
            document.getElementById('stat-conversion').innerText = (dashboard.conversionRate || 0) + '%';
        }

        function updateCart(cart) {
            const container = document.getElementById('cart-items');
            const totalDisplay = document.getElementById('cart-total-display');
            
            container.innerHTML = ''; // ניקוי
            let total = 0;

            if (!cart || cart.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 20px;">העגלה ריקה</div>';
            } else {
                cart.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div style="font-weight:bold;">${item.product_name}</div>
                        <div style="display:flex; justify-content:space-between; margin-top:5px;">
                            <span>${item.qty} יח'</span>
                            <span>₪${item.client_price}</span>
                        </div>
                        <div style="font-size:0.8rem; color:#94a3b8;">${item.paper_type || 'רגיל'}</div>
                    `;
                    container.appendChild(itemDiv);
                    total += item.client_price;
                });
            }

            totalDisplay.innerText = 'סה"כ: ₪' + total.toLocaleString();
        }

        async function downloadPDF() {
            if (!currentCart || currentCart.length === 0) {
                alert("העגלה ריקה! אין מה להדפיס.");
                return;
            }

            try {
                const response = await fetch('/api/pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: currentCart, customer: { name: 'אורח' } }) // אפשר לשפר עם שם הלקוח
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "quote.pdf";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert("שגיאה בהפקת PDF");
                }
            } catch (e) {
                console.error(e);
                alert("תקלה בהורדת הקובץ");
            }
        }

        // --- Event Listeners ---
        
        // שליחה ב-Enter
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

    </script>
</body>
</html>
